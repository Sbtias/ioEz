<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OEIOS</title><link rel="stylesheet" href="style.css"></head><body><div class="glow"></div><header><b>● OEIOS</b><button id="topAccount">Cuenta</button></header><main><section id="auth"><div class="hero"><small>OEIOS SYSTEM</small><h1>Tu teléfono.<br><i>A tu manera.</i></h1><p>Un sistema operativo virtual elegante, rápido y completamente personalizable.</p></div><div class="card"><nav><button class="tab active" data-mode="login">Entrar</button><button class="tab" data-mode="register">Crear cuenta</button></nav><form id="form"><label>Usuario<input id="user" required placeholder="Nombre de usuario"></label><label id="emailBox" class="hide">Correo<input id="email" type="email" placeholder="tu@email.com"></label><label>Contraseña<input id="pass" type="password" required minlength="4" placeholder="••••••••"></label><button class="go">Continuar <span>→</span></button></form><p id="message"></p></div></section><section id="system" class="hide"><div class="bar"><div><small>OEIOS</small><h2>Hola, <span id="hello"></span> 👋</h2></div><button id="exit">Salir</button></div><div class="workspace"><div class="phone" id="phone"><div class="island"></div><div class="status"><span id="clock">9:41</span><span>ᯤ ▰</span></div><div class="screen"><div class="time" id="bigClock">9:41</div><div id="today"></div><div class="cards"><div>☀️<strong>24°</strong><small>San Juan</small></div><div><strong>87%</strong><small>Batería</small></div></div></div><div class="apps"><span>☎</span><span>✉</span><span>◎</span><span>⚙</span></div><div class="home"></div></div><div class="settings"><h3>Personalizar OEIOS</h3><label>Color de acento<input id="accent" type="color" value="#ffffff"></label><label>Nombre<input id="displayName" maxlength="18"></label><div class="palette"><button data-bg="#050505"></button><button data-bg="#111827"></button><button data-bg="#21112c"></button><button data-bg="#10251d"></button></div><button id="save" class="save">Guardar cambios ✓</button><p id="saved"></p></div></div></section></main><script src="script.js"></script></body></html>
